spring:
  application:
    name: ss14-discord-bridge
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  flyway:
    enabled: true

api:
  key: ${INTERNAL_API_KEY}
  allowed-ips: ${API_ALLOWED_IPS:}

ss14:
  server-ip: ${SS14_SERVER_IP}

stats:
  retention-days: ${STATS_RETENTION_DAYS:}

server:
  port: ${BACKEND_PORT:8080}

discord:
  token: ${DISCORD_TOKEN}
  guild-id: ${DISCORD_GUILD_ID}
  roles:
    verified: ${DISCORD_VERIFIED_ROLE_ID}
    booster: ${DISCORD_BOOSTER_ROLE_ID}
    boosty: ${DISCORD_BOOSTY_ROLES:}
  maintainer-id: ${DISCORD_MAINTAINER_ID}

boosty:
  weekly-tokens: ${BOOSTY_WEEKLY_TOKENS:}

management:
  endpoints:
    web:
      exposure:
        include: health
