spring:
  application:
    name: bot-backend
  task:
    scheduling:
      pool-size: 2

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  flyway:
    enabled: true

internal:
  api:
    key: ${INTERNAL_API_KEY}

api:
  allowed-ips: ${API_ALLOWED_IPS:}

server:
  port: ${BACKEND_PORT:8080}

discord:
  token: ${DISCORD_TOKEN}
  guild-id: ${DISCORD_GUILD_ID}
  roles:
    verified: 1359900955596034271
    booster: 1359980717387550893
    boosty:
      1: 1551897052340953128
      2: 1551897127955857448
      3: 1551897189330980977
  developer-id: 431760864631324674

management:
  endpoints:
    web:
      exposure:
        include: health
